<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Monopoly Money Manager</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  margin:0;
  font-family:sans-serif;
  background:#0f172a;
  color:white;
}

.container { padding:16px; }

input, button {
  padding:10px;
  border-radius:8px;
  border:none;
}

button {
  cursor:pointer;
  font-weight:bold;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;
}

.card {
  padding:12px;
  border-radius:12px;
  position:relative;
}

.toast {
  position:fixed;
  top:20px;
  right:20px;
  background:#111;
  padding:12px;
  border-radius:8px;
  opacity:0.9;
  margin-top:10px;
}

.hidden { display:none; }

.header {
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div id="setup" class="container">
  <h2>ตั้งค่าตัวละคร</h2>

  <input id="name" placeholder="ชื่อผู้เล่น"/><br><br>

  <label>เลือกสี:</label><br>
  <input type="color" id="color" value="#ff0000"><br><br>

  <label>เลือกบทบาท:</label><br>
  <select id="role">
    <option value="player">👤 Player</option>
    <option value="banker">👑 Banker</option>
  </select><br><br>

  <button onclick="joinGame()">เข้าสู่เกม</button>
</div>

<div id="game" class="container hidden">

  <div class="header">
    <div id="me"></div>
    <button onclick="toggleHide()">👁️ ซ่อนเงิน</button>
  </div>

  <h3>ผู้เล่นทั้งหมด</h3>
  <div id="players" class="grid"></div>

  <h3>จ่ายภาษี</h3>
  <input id="tax" placeholder="จำนวนเงิน"/>
  <button onclick="payTax()">จ่ายภาษี</button>

</div>

<script>
const SUPABASE_URL = "https://eingzlyhkxtxxrehgeky.supabase.co";
const SUPABASE_KEY = "sb_publishable_k4GcVzXO_cyy8L7MtOBZfg_JX0SzFWR";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let myId = null;
let players = [];

async function joinGame() {
  const name = document.getElementById('name').value;
  const color = document.getElementById('color').value;
  const role = document.getElementById('role').value;

  const { data: existingBanker } = await supabase
    .from('players')
    .select('*')
    .eq('is_banker', true);

  if (role === 'banker' && existingBanker.length > 0) {
    alert("มี Banker แล้ว!");
    return;
  }

  const { data } = await supabase
    .from('players')
    .insert({
      name,
      color,
      is_banker: role === 'banker'
    })
    .select()
    .single();

  myId = data.id;

  document.getElementById('setup').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');

  listenRealtime();
  loadPlayers();
}

async function loadPlayers() {
  const { data } = await supabase.from('players').select('*');
  players = data;
  render();
}

function render() {
  const container = document.getElementById('players');
  container.innerHTML = "";

  players.forEach(p => {
    const div = document.createElement('div');
    div.className = "card";
    div.style.background = p.color;

    let moneyText = p.hide_balance ? "💰 ???" : "$" + p.money;

    div.innerHTML = `
      <b>${p.name}</b><br>
      ${p.is_banker ? "👑 Banker" : "👤 Player"}<br>
      ${moneyText}
    `;

    div.onclick = () => transferPrompt(p);

    if (isMeBanker() && !p.is_banker) {
      const btn = document.createElement('button');
      btn.innerText = "+$200";
      btn.onclick = (e) => {
        e.stopPropagation();
        giveMoney(p.id, 200);
      };
      div.appendChild(btn);
    }

    container.appendChild(div);
  });

  const me = players.find(p => p.id === myId);
  if (me) {
    document.getElementById('me').innerText =
      `${me.name} (${me.is_banker ? 'Banker' : 'Player'}) $${me.money}`;
  }
}

function isMeBanker() {
  const me = players.find(p => p.id === myId);
  return me?.is_banker;
}

async function giveMoney(targetId, amount) {
  const target = players.find(p => p.id === targetId);
  await supabase
    .from('players')
    .update({ money: target.money + amount })
    .eq('id', targetId);

  showToast(`🎉 ให้เงิน $${amount}`);
}

async function transferPrompt(target) {
  if (target.id === myId) return;

  const amount = prompt(`โอนเงินให้ ${target.name}`);
  if (!amount) return;

  const me = players.find(p => p.id === myId);

  if (me.money < amount) {
    alert("เงินไม่พอ");
    return;
  }

  await supabase.from('players').update({ money: me.money - amount }).eq('id', myId);
  await supabase.from('players').update({ money: target.money + Number(amount) }).eq('id', target.id);

  showToast(`💸 โอน ${amount} ให้ ${target.name}`);
}

async function payTax() {
  const amount = document.getElementById('tax').value;
  const me = players.find(p => p.id === myId);

  if (me.money < amount) return alert("เงินไม่พอ");

  await supabase.from('players')
    .update({ money: me.money - Number(amount) })
    .eq('id', myId);

  showToast(`💸 จ่ายภาษี $${amount}`);
}

async function toggleHide() {
  const me = players.find(p => p.id === myId);

  await supabase.from('players')
    .update({ hide_balance: !me.hide_balance })
    .eq('id', myId);
}

function listenRealtime() {
  supabase.channel('players')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'players' },
      payload => {
        loadPlayers();

        if (payload.new?.id === myId) {
          const diff = payload.new.money - payload.old.money;
          if (diff > 0) showToast(`🎉 +$${diff}`);
          if (diff < 0) showToast(`💸 -$${Math.abs(diff)}`);
        }
      }
    )
    .subscribe();
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerText = msg;
  document.body.appendChild(t);

  setTimeout(() => t.remove(), 3000);
}
</script>

</body>
</html>
